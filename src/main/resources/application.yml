spring:
  # 数据源配置 - 优先使用你的MySQL root用户 
  datasource:
    url: jdbc:mysql://localhost:3306/personal_blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境使用update，生产环境建议使用validate
    show-sql: true      # 显示SQL语句（开发环境）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # Thymeleaf模板引擎配置
  thymeleaf:
    cache: false        # 开发环境关闭缓存
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

# 日志配置
logging:
  level:
    org.springframework.web: INFO
    org.hibernate: INFO
    org.example: DEBUG

# 服务器配置  
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境不自动修改表结构
    show-sql: false       # 生产环境不显示SQL
  thymeleaf:
    cache: true           # 生产环境开启缓存

logging:
  level:
    org.example: INFO