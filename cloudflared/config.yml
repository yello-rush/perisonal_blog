tunnel: your-tunnel-id-here
credentials-file: /etc/cloudflared/credentials.json

# 使用HTTP/2协议避免QUIC连接问题
protocol: http2

# 日志设置
loglevel: info

# 服务映射
ingress:
  # 您的博客域名
  - hostname: yourdomain.com
    service: http://app:8080
  # 如果有www子域名
  - hostname: www.yourdomain.com
    service: http://app:8080
  # 兜底规则
  - service: http_status:404