services:
  blog-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-blog:latest
    container_name: blog-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=personal_blog
      - DB_USERNAME=root
      - DB_PASSWORD=root123456
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blog-network
    volumes:
      - app-logs:/app/logs

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=personal_blog
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 初始化SQL脚本
      - ./mysql-data/blogs.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # MySQL配置文件
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    restart: unless-stopped
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - blog-app
    restart: unless-stopped
    networks:
      - blog-network
    profiles:
      - nginx

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: unless-stopped
    networks:
      - blog-network
    profiles:
      - redis
      
  prometheus:
    image: prom/prometheus:latest
    container_name: blog-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - blog-network

  # Grafana - 可视化展示
  grafana:
    image: grafana/grafana:latest
    container_name: blog-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - blog-network

  # Node Exporter - 系统资源监控
  node-exporter:
    image: prom/node-exporter:latest
    container_name: blog-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - blog-network

  # MySQL Exporter - 数据库监控
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: blog-mysql-exporter
    ports:
      - "9104:9104"
    environment:
      - DATA_SOURCE_NAME=root:root123456@tcp(mysql:3306)/personal_blog
    command:
      - '--config.my-cnf=/etc/mysqld-exporter/.my.cnf'
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
    volumes:
      - ./docker/mysql-exporter:/etc/mysqld-exporter:ro
    restart: unless-stopped
    networks:
      - blog-network
    depends_on:
      mysql:
        condition: service_healthy

  # Redis Exporter - 缓存监控（可选）
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: blog-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    networks:
      - blog-network
    depends_on:
      - redis
    profiles:
      - redis

# 网络配置
networks:
  blog-network:
    driver: bridge

# 数据卷配置
volumes:
  mysql_data:
  redis_data:
  app-logs:
  nginx_logs:
  prometheus_data:
  grafana_data: