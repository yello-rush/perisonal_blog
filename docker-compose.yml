version: '3.8'

services:
  # Spring Boot 应用服务
  blog-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-blog:latest
    container_name: blog-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=personal_blog
      - DB_USERNAME=root
      - DB_PASSWORD=root123456
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blog-network
    volumes:
      - app-logs:/app/logs

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=personal_blog
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 初始化SQL脚本
      - ./mysql-data/blogs.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # MySQL配置文件
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    restart: unless-stopped
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - blog-app
    restart: unless-stopped
    networks:
      - blog-network
    profiles:
      - nginx

  # Redis 缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: unless-stopped
    networks:
      - blog-network
    profiles:
      - redis

# 网络配置
networks:
  blog-network:
    driver: bridge
    name: blog-network

# 数据卷配置
volumes:
  mysql_data:
    name: blog_mysql_data
  redis_data:
    name: blog_redis_data
  app-logs:
    name: blog_app_logs
  nginx_logs:
    name: blog_nginx_logs